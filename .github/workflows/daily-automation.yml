name: Daily Blog Automation

on:
  schedule:
    # Runs at 02:00 UTC every day. Adjust as needed.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      articles_per_run:
        description: "How many articles to generate this run"
        required: false
        default: "10"
      skip_image:
        description: "Skip image fetch/upload (true/false) - useful for quick tests"
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          GEMINI_KEY_6: ${{ secrets.GEMINI_KEY_6 }}
          GEMINI_KEY_7: ${{ secrets.GEMINI_KEY_7 }}
          GEMINI_KEY_8: ${{ secrets.GEMINI_KEY_8 }}
          GEMINI_KEY_9: ${{ secrets.GEMINI_KEY_9 }}
          GEMINI_KEY_10: ${{ secrets.GEMINI_KEY_10 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.articles_per_run || '10' }}
          SKIP_IMAGE: ${{ github.event.inputs.skip_image || 'false' }}
        run: python -m scripts.main

      - name: Commit updated topics/used-topics files
        run: |
          git config user.name "nextgen-automation-bot"
          git config user.email "actions@github.com"
          git add data/topics.txt data/used_topics.txt || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update topics after daily run"
          git push
